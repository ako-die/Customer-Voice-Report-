<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Customer Voice</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(145deg,#003b7a,#0066b3,#eaf4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#123;
}

.app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:30px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:28px;
}

.logo-icon{
    width:78px;
    height:78px;
    margin:auto;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0052a5;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.logo h1{
    margin-top:18px;
    font-size:27px;
    letter-spacing:1px;
}

.logo p{
    margin-top:8px;
    font-size:14px;
    opacity:.9;
}

.card{
    background:rgba(255,255,255,.96);
    border-radius:28px;
    padding:28px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.card h2{
    text-align:center;
    color:#0052a5;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:24px;
}

.role{
    display:flex;
    gap:12px;
}

.role button{
    flex:1;
    border:0;
    border-radius:16px;
    padding:18px 10px;
    background:#f1f6fb;
    color:#0052a5;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.role button:hover{
    background:#0052a5;
    color:white;
}

.icon{
    display:block;
    font-size:30px;
    margin-bottom:8px;
}

.footer{
    text-align:center;
    color:white;
    font-size:12px;
    margin-top:25px;
    opacity:.95;
}

.created{
    font-weight:bold;
    margin-top:6px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">

        <div class="logo-icon">
            DCV
        </div>

        <h1>DIGITAL CUSTOMER VOICE</h1>

        <p>Smart Customer Voice Solution</p>

    </div>


    <div class="card">

        <h2>Selamat Datang</h2>

        <div class="subtitle">
            Silakan pilih akses Anda
        </div>

        <div class="role">

            <button onclick="petugas()">
                <span class="icon">👤</span>
                PETUGAS
            </button>

            <button onclick="pejabat()">
                <span class="icon">👔</span>
                PEJABAT
            </button>

        </div>

    </div>


    <div class="footer">

        Digital Customer Voice

        <div class="created">
            Created by Dee
        </div>

    </div>

</div>


<script>

function petugas(){
    alert("Menu PETUGAS akan kita bangun pada tahap berikutnya.");
}

function pejabat(){
    alert("Menu PEJABAT akan kita bangun pada tahap berikutnya.");
}

</script>

</body>
</html>
