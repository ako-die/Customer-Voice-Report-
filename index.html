<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Customer Voice</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(145deg,#003b7a,#0066b3,#eaf4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#123;
}

.app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:30px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:28px;
}

.logo-icon{
    width:78px;
    height:78px;
    margin:auto;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0052a5;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.logo h1{
    margin-top:18px;
    font-size:27px;
    letter-spacing:1px;
}

.logo p{
    margin-top:8px;
    font-size:14px;
    opacity:.9;
}

.card{
    background:rgba(255,255,255,.96);
    border-radius:28px;
    padding:28px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.card h2{
    text-align:center;
    color:#0052a5;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:24px;
}

.role{
    display:flex;
    gap:12px;
}

.role button{
    flex:1;
    border:0;
    border-radius:16px;
    padding:18px 10px;
    background:#f1f6fb;
    color:#0052a5;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.role button:hover{
    background:#0052a5;
    color:white;
}

.icon{
    display:block;
    font-size:30px;
    margin-bottom:8px;
}

.footer{
    text-align:center;
    color:white;
    font-size:12px;
    margin-top:25px;
    opacity:.95;
}

.created{
    font-weight:bold;
    margin-top:6px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">

        <div class="logo-icon">
            DCV
        </div>

        <h1>DIGITAL CUSTOMER VOICE</h1>

        <p>Smart Customer Voice Solution</p>

    </div>


    <div class="card">

        <h2>Selamat Datang</h2>

        <div class="subtitle">
            Silakan pilih akses Anda
        </div>

        <div class="role">

            <button onclick="petugas()">
                <span class="icon">👤</span>
                PETUGAS
            </button>

            <button onclick="pejabat()">
                <span class="icon">👔</span>
                PEJABAT
            </button>

        </div>

    </div>


    <div class="footer">

        Digital Customer Voice

        <div class="created">
            Created by Dee
        </div>

    </div>

</div>


<script>

function petugas(){
    document.body.innerHTML = `
    <div style="
        min-height:100vh;
        background:linear-gradient(145deg,#003b7a,#0066b3,#eaf4ff);
        padding:25px 20px;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
        color:#123;
    ">

        <div style="
            max-width:430px;
            margin:auto;
        ">

            <div style="
                text-align:center;
                color:white;
                margin-bottom:25px;
            ">
                <div style="
                    width:65px;
                    height:65px;
                    margin:auto;
                    border-radius:50%;
                    background:white;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#0052a5;
                    font-size:22px;
                    font-weight:bold;
                ">
                    DCV
                </div>

                <h1 style="margin:15px 0 5px;font-size:25px;">
                    PETUGAS
                </h1>

                <p style="margin:0;">
                    Digital Customer Voice
                </p>
            </div>

            <div style="
                background:white;
                border-radius:25px;
                padding:25px 20px;
                box-shadow:0 10px 30px rgba(0,0,0,.2);
            ">

                <h2 style="
                    text-align:center;
                    color:#0052a5;
                    margin-top:0;
                ">
                    Laporan Suara Pelanggan
                </h2>

                <label>Nama Petugas</label>
                <input id="nama" type="text"
                    placeholder="Masukkan nama petugas"
                    style="width:100%;padding:13px;margin:8px 0 15px;box-sizing:border-box;border-radius:10px;border:1px solid #ccc;">

                <label>Tanggal</label>
                <input id="tanggal" type="date"
                    style="width:100%;padding:13px;margin:8px 0 15px;box-sizing:border-box;border-radius:10px;border:1px solid #ccc;">

                <label>Suara Pelanggan</label>
                <textarea id="suara"
                    placeholder="Tuliskan suara atau masukan pelanggan..."
                    style="width:100%;height:120px;padding:13px;margin:8px 0 15px;box-sizing:border-box;border-radius:10px;border:1px solid #ccc;resize:none;"></textarea>

                <button onclick="simpanLaporan()" style="
                    width:100%;
                    padding:15px;
                    border:0;
                    border-radius:12px;
                    background:#0052a5;
                    color:white;
                    font-size:16px;
                    font-weight:bold;
                ">
                    SIMPAN LAPORAN
                </button>

                <button onclick="location.reload()" style="
                    width:100%;
                    padding:13px;
                    margin-top:10px;
                    border:0;
                    border-radius:12px;
                    background:#eef5fb;
                    color:#0052a5;
                    font-weight:bold;
                ">
                    KEMBALI
                </button>

            </div>

            <div style="
                text-align:center;
                color:white;
                margin-top:25px;
                font-size:13px;
            ">
                Digital Customer Voice<br>
                <b>Created by Dee</b>
            </div>

        </div>
    </div>
    `;
}

function simpanLaporan(){

    const nama = document.getElementById("nama").value.trim();
    const tanggal = document.getElementById("tanggal").value;
    const suara = document.getElementById("suara").value.trim();

    if(!nama || !tanggal || !suara){
        alert("Mohon lengkapi semua data.");
        return;
    }

    const laporan = {
        id: Date.now(),
        nama: nama,
        tanggal: tanggal,
        suara: suara
    };

    let dataLaporan = JSON.parse(
        localStorage.getItem("digitalCustomerVoice")
    ) || [];

    dataLaporan.push(laporan);

    localStorage.setItem(
        "digitalCustomerVoice",
        JSON.stringify(dataLaporan)
    );

    alert("Laporan berhasil disimpan.");

    document.getElementById("nama").value = "";
    document.getElementById("tanggal").value = "";
    document.getElementById("suara").value = "";
}
    alert("Laporan berhasil dicatat.");
}

function pejabat(){
    alert("Menu PEJABAT akan kita bangun pada tahap berikutnya.");
}

</script>

</body>
</html>
